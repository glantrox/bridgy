name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target '${{ matrix.target }}'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Package and checksum
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/bridgy'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/package_release.py --binary "$binary" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bridgy-${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render Homebrew and WinGet packages from release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
        run: |
          args=()
          if [ -n "$PACKAGE_ID" ]; then args+=(--package-id "$PACKAGE_ID"); fi
          python scripts/render_packages.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/bridgy-packages" "${args[@]}"
          ruby -c "$RUNNER_TEMP/bridgy-packages/bridgy.rb"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf dist/bridgy-packages.tar.gz -C "$RUNNER_TEMP/bridgy-packages" .
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          files=(dist/* install.sh install.ps1)
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"); then
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes "${args[@]}"
            exit 0
          fi

          # A maintainer can create the release in the UI while builds are running.
          if (( ${#args[@]} )); then
            gh release edit "$RELEASE_TAG" "${args[@]}"
          fi
          missing=()
          for file in "${files[@]}"; do
            digest=$(jq -r --arg name "${file##*/}" '.assets[] | select(.name == $name) | .digest' <<< "$release")
            if [[ -z "$digest" ]]; then
              missing+=("$file")
            elif [[ "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
              echo "Existing release asset differs: ${file##*/}" >&2
              exit 1
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
